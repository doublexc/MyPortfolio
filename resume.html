<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resume">
    <title>Resume</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="resume">

    <!-- ปุ่มกด Print / Save PDF (จะซ่อนตัวเองอัตโนมัติเมื่อกดพิมพ์) -->
    <div class="resume-actions no-print" style="text-align: right; max-width: 800px; margin: 1rem auto 0; padding: 0 1rem;">
        <button id="btnPrint" onclick="window.print()" class="btn btn-primary" style="cursor: pointer; padding: 0.5rem 1rem;">
            🖨️ Print / Save PDF
        </button>
    </div>

    <main class="resume-page">

        <!-- =====================================
                Header
        ====================================== -->
        <header class="resume-header">
            <div class="resume-photo">
                <img id="profilePhoto" class="profilePhoto" src="" alt="Profile">
            </div>

            <div class="resume-profile">
                <h1 id="nameEN" class="nameEN"></h1>
                <h2 id="nameTH" class="nameTH"></h2>
                <h3 id="jobTitle" class="jobTitle"></h3>
                <p id="summary" class="summary"></p>
            </div>
        </header>

        <!-- =====================================
                Contact
        ====================================== -->
        <section class="resume-section">
            <h2>Contact</h2>
            <div class="resume-contact">
                <div>
                    <strong>Email</strong>
                    <div class="email"></div>
                </div>

                <div>
                    <strong>Phone</strong>
                    <div class="phone"></div>
                </div>

                <div>
                    <strong>GitHub</strong>
                    <div><a class="github" target="_blank"></a></div>
                </div>

                <div>
                    <strong>Portfolio</strong>
                    <div><a class="portfolio" target="_blank"></a></div>
                </div>
            </div>
        </section>

        <!-- =====================================
                Education
        ====================================== -->
        <section class="resume-section" data-section>
            <h2>Education</h2>
            <div id="education" class="grid"></div>
        </section>

        <!-- =====================================
                Experience
        ====================================== -->
        <section class="resume-section" data-section>
            <h2>Experience</h2>
            <div id="experience" class="grid"></div>
        </section>

        <!-- =====================================
                Skills
        ====================================== -->
        <section class="resume-section" data-section>
            <h2>Skills</h2>
            <div id="skills" class="grid"></div>
        </section>

        <!-- =====================================
                Featured Projects
        ====================================== -->
        <section class="resume-section" data-section>
            <h2>Featured Projects</h2>
            <!-- render.js จะดึงเฉพาะโครงการที่เป็น featured ตามจำนวนที่กำหนดใน resume.featuredProjects มาใส่ตรงนี้ -->
            <div id="resumeProjects" class="grid"></div>
        </section>

        <!-- =====================================
                Languages
        ====================================== -->
        <section class="resume-section" data-section>
            <h2>Languages</h2>
            <div id="languages" class="grid"></div>
        </section>

        <!-- =====================================
                Certificates
        ====================================== -->
        <section id="certificatesSection" class="resume-section" data-section>
            <h2>Certificates</h2>
            <div id="certificates" class="grid"></div>
        </section>

    </main>

    <!-- Script สำหรับ Render ข้อมูล -->
    <script src="js/render.js"></script>
    <!-- Script สำหรับรองรับ PDF (ถ้ามี) -->
    <script src="js/pdf.js"></script>

</body>

</html>
